appId: com.selectai.app
productName: SelectAI
icon: build/icon.png
npmRebuild: false
afterPack: scripts/after-pack.mjs
directories:
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: build/icon.png
    to: build/icon.png
  # Windows window icon: same artwork with the rounded corners flattened onto
  # the background colour, so the shell never fills them in white.
  - from: build/icon-win.png
    to: build/icon-win.png
  # Tray icon: contrast/saturation boosted variant of the artwork so it stays
  # legible at 16px in the notification area.
  - from: build/tray-icon.png
    to: build/tray-icon.png
asarUnpack:
  - node_modules/selection-hook/**
  - node_modules/uiohook-napi/**
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  artifactName: SelectAI-${version}-${arch}-mac.${ext}
  target:
    - dmg
    - zip
  extendInfo:
    NSAppleEventsUsageDescription: SelectAI uses accessibility APIs to detect selected text.
    NSSystemAdministrationUsageDescription: SelectAI needs accessibility permission to detect selected text.
dmg:
  artifactName: SelectAI-${version}-${arch}.${ext}
win:
  # Full-bleed opaque variant: small sizes stored as 32bpp BMP entries so the
  # legacy shell icon paths (taskbar / title bar) get real alpha-capable data
  # instead of PNG entries they cannot read.
  icon: build/icon-win.ico
  # rcedit needs wine on Linux; the app icon is stamped by scripts/after-pack.mjs (resedit, pure JS) instead
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  installerIcon: build/icon-win.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: SelectAI-Setup-${version}.${ext}
portable:
  artifactName: SelectAI-Portable-${version}.${ext}
